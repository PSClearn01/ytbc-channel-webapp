version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ytbc-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boxing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boxing"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ytbc-web
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/boxing
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
